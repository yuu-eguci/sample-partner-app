# PR と main への push のたびに、テスト・ビルドと Docker Compose での起動確認を行います。
# 実際の Shopify には接続せず、モック Shopify (mock/shopify) を使います。
name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: 26
  NPM_VERSION: 12.2.3

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run build
        env:
          SHOPIFY_API_KEY: ci-api-key

  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml:compose.mock.yaml
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach --wait
      - run: docker compose run --rm smoke
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
